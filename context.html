<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Organisation Context | Servitisation.world ALIGN</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #172231;
    background: #ffffff;
}

header {
    border-bottom: 1px solid #e5e7eb;
    padding: 30px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 24px;
    letter-spacing: 2px;
}

.brand strong {
    font-weight: 700;
}

.tagline {
    font-size: 15px;
}

main {
    max-width: 900px;
    margin: 70px auto;
    padding: 0 30px;
}

.step {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

h1 {
    font-size: 46px;
    line-height: 1.1;
    margin: 0 0 20px;
}

.intro {
    font-size: 20px;
    line-height: 1.6;
    color: #536273;
    max-width: 760px;
    margin-bottom: 50px;
}

.form-group {
    margin-bottom: 32px;
}

label {
    display: block;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
}

.help {
    display: block;
    font-size: 14px;
    font-weight: 400;
    color: #6b7280;
    margin-top: 5px;
}

select,
input {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    border: 1px solid #cfd5dc;
    border-radius: 4px;
    background: white;
}

select:focus,
input:focus {
    outline: 2px solid #172231;
    outline-offset: 1px;
}

button {
    margin-top: 15px;
    padding: 18px 28px;
    background: #111c2c;
    color: white;
    border: none;
    border-radius: 3px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #263548;
}

@media (max-width: 700px) {

    header {
        padding: 22px;
    }

    .tagline {
        display: none;
    }

    main {
        margin-top: 45px;
    }

    h1 {
        font-size: 36px;
    }
}

</style>
</head>

<body>

<header>

<div class="brand">
<strong>SERVITISATION.WORLD</strong>&nbsp;&nbsp; | &nbsp;&nbsp;ALIGN
</div>

<div class="tagline">
Leadership Alignment for Service Growth
</div>

</header>

<main>

<div class="step">
STEP 2 OF 3 · ORGANISATION CONTEXT
</div>

<h1>
Tell us a little about your organisation.
</h1>

<p class="intro">
This helps us interpret your leadership alignment results in the context
of your organisation and its servitisation journey.
</p>

<form id="contextForm">


<div class="form-group">

<label>
Current service revenue
<span class="help">Approximately what percentage of total revenue currently comes from services?</span>
</label>

<select id="serviceRevenue" required>

<option value="">Select service revenue</option>
<option>0–5%</option>
<option>6–10%</option>
<option>11–20%</option>
<option>21–40%</option>
<option>41–60%</option>
<option>More than 60%</option>
<option>Not sure</option>

</select>

</div>


<div class="form-group">

<label>
Servitisation ambition
<span class="help">How important is service growth to the organisation's strategy?</span>
</label>

<select id="ambition" required>

<option value="">Select strategic importance</option>
<option>Not currently a strategic priority</option>
<option>Being explored</option>
<option>An emerging strategic priority</option>
<option>A major strategic priority</option>
<option>Central to our future business model</option>

</select>

</div>



  <div class="form-group">

<label>
What is the primary objective of your organisation's service agenda today?
<span class="help">Choose the outcome that best reflects what the organisation is actually prioritising today, rather than what it intends to prioritise.</span>
</label>

<select id="currentServiceObjective" required>
<option value="">Select current primary objective</option>
<option>Generate service revenue and growth</option>
<option>Improve customer experience and satisfaction</option>
<option>Increase customer retention and loyalty</option>
<option>Improve operational efficiency and reduce cost</option>
<option>Differentiate from competitors</option>
<option>Strengthen product sales through service</option>
<option>Build long-term customer partnerships</option>
<option>Develop new service-based business models</option>
<option>Respond faster and improve service capability</option>
<option>There is no clear primary objective today</option>
</select>

</div> 
    
<div class="form-group">

<label>
What should the primary objective of your organisation's service agenda be?
<span class="help">Choose the outcome you believe should become the organisation's main service priority.</span>
</label>

<select id="desiredServiceObjective" required>
<option value="">Select desired primary objective</option>
<option>Generate service revenue and growth</option>
<option>Improve customer experience and satisfaction</option>
<option>Increase customer retention and loyalty</option>
<option>Improve operational efficiency and reduce cost</option>
<option>Differentiate from competitors</option>
<option>Strengthen product sales through service</option>
<option>Build long-term customer partnerships</option>
<option>Develop new service-based business models</option>
<option>Respond faster and improve service capability</option>
</select>

</div>
    
<div class="form-group">

<label>
What is the main driver for increasing your organisation's focus on services?
<span class="help">Choose the factor creating the strongest need for change.</span>
</label>

<select id="serviceChangeDriver" required>
<option value="">Select primary driver</option>
<option>Pressure to grow revenue</option>
<option>Declining margins in the core product business</option>
<option>Changing customer expectations</option>
<option>Competitive pressure</option>
<option>Need for more predictable recurring revenue</option>
<option>Need to strengthen customer relationships</option>
<option>Digital or technology opportunities</option>
<option>Pressure to improve operational efficiency</option>
<option>Strategic shift towards services</option>
<option>No single clear driver</option>
</select>

</div>
    <div class="form-group">

<label>
How aligned is your leadership team on the organisation's service strategy?
<span class="help">Choose the option that best reflects the level of agreement across senior leaders today.</span>
</label>

<select id="leadershipAlignment" required>
<option value="">Select level of alignment</option>
<option>Strongly aligned — there is a shared view of the direction</option>
<option>Mostly aligned — some differences exist but the direction is broadly shared</option>
<option>Partially aligned — there are significant differences in priorities or approach</option>
<option>Poorly aligned — leaders have substantially different views</option>
<option>There is currently no clear shared service strategy</option>
</select>

</div>
    <div class="form-group">

<label>
Over what timeframe does the organisation expect to make meaningful progress on its service strategy?
<span class="help">Choose the timeframe that best reflects the organisation's current expectations.</span>
</label>

<select id="serviceTimeHorizon" required>
<option value="">Select expected timeframe</option>
<option>Immediate — within the next 3 months</option>
<option>Near term — within 3–6 months</option>
<option>Medium term — within 6–12 months</option>
<option>Longer term — within 1–3 years</option>
<option>Exploratory — no defined timeframe yet</option>
</select>

</div>
    <div class="form-group">

<label>
What does servitisation mean to your organisation today?
<span class="help">Describe, in your own words, the role you believe service currently plays in the organisation.</span>
</label>

<textarea id="serviceMeaning" rows="4" required placeholder="For example: revenue growth, customer support, operational efficiency, differentiation, product support, customer retention..."></textarea>

</div>
<div class="form-group">

<label>
What do you believe customers value most from your service organisation?
<span class="help">Choose the single outcome you believe matters most to customers today.</span>
</label>

<select id="customerValuePriority" required>
<option value="">Select the primary customer value</option>
<option>Fast response and availability</option>
<option>Technical expertise and problem resolution</option>
<option>Reliability and uptime</option>
<option>Lower total cost of ownership</option>
<option>Ease of doing business</option>
<option>Proactive support and prevention</option>
<option>Business outcomes and performance</option>
<option>Long-term partnership and trusted advice</option>
<option>Innovation and new capabilities</option>
<option>Customers value different things — there is no clear priority</option>
</select>

</div>

    <div class="form-group">

<label>
How quickly are customer expectations for service changing in your market?
<span class="help">Consider expectations around speed, convenience, digital access, outcomes, personalisation and support.</span>
</label>

<select id="customerExpectationChange" required>
<option value="">Select the rate of change</option>
<option>Very rapidly — expectations are changing faster than we can currently respond</option>
<option>Rapidly — significant changes are happening each year</option>
<option>Moderately — expectations are evolving but remain manageable</option>
<option>Slowly — customer expectations are relatively stable</option>
<option>Very little change — expectations are largely unchanged</option>
<option>We do not have enough customer insight to know</option>
</select>

</div>
    <div class="form-group">

<label>
How well does your organisation currently understand what customers expect from its services?
<span class="help">Consider how strong your customer insight is across needs, expectations, priorities and desired outcomes.</span>
</label>

<select id="customerInsightStrength" required>
<option value="">Select level of customer insight</option>
<option>Very strong – we have clear, current and evidence-based customer insight</option>
<option>Strong – we understand our customers well, with some gaps</option>
<option>Moderate – we have useful insight but it is fragmented or inconsistent</option>
<option>Limited – much of our understanding is based on assumptions or informal feedback</option>
<option>Very limited – we have little reliable insight into customer expectations</option>
<option>Varies significantly across customers, markets or business units</option>
</select>

</div>
    <div class="form-group">


<label>
How consistently does your organisation use customer insight when making service decisions?
<span class="help">Consider whether customer evidence influences service design, investment priorities and operational decisions.</span>
</label>

<select id="customerInsightUse" required>
<option value="">Select level of customer insight use</option>
<option>Consistently – customer insight directly informs major service decisions</option>
<option>Frequently – customer insight influences most service decisions</option>
<option>Sometimes – customer insight is used, but not consistently</option>
<option>Rarely – decisions are mainly driven by internal priorities or assumptions</option>
<option>Very rarely – customer insight has little influence on service decisions</option>
<option>Varies significantly across the organisation</option>
</select>

</div>
<label>
Who is completing this assessment?
<span class="help">This helps us understand whose perspective is represented in the results.</span>
</label>

<select id="respondentRole" required>
<option value="">Select your role</option>
<option>CEO / Managing Director</option>
<option>Executive Leadership Team</option>
<option>Senior Leader / Director</option>
<option>Functional Leader</option>
<option>Regional / Country Leader</option>
<option>Other</option>
</select>
</div>
    
 <div class="form-group">

<label>
Which function do you primarily represent?
<span class="help">This helps identify where different perspectives on servitisation sit across the leadership team.</span>
</label>

<select id="respondentFunction" required>
<option value="">Select your function</option>
<option>General Management / Executive</option>
<option>Sales</option>
<option>Marketing</option>
<option>Service / Aftermarket</option>
<option>Operations</option>
<option>Finance</option>
<option>Technology / Digital / IT</option>
<option>Product / Engineering / R&amp;D</option>
<option>Customer Experience / Customer Success</option>
<option>HR / People</option>
<option>Strategy / Transformation</option>
<option>Other</option>
</select>

</div>
    
 <div class="form-group">

<label>
Which geography do you primarily represent?
<span class="help">This helps distinguish global, regional and country perspectives on the organisation's service strategy.</span>
</label>

<select id="respondentGeography" required>
<option value="">Select your geography</option>
<option>Global / Group</option>
<option>Europe</option>
<option>North America</option>
<option>Latin America</option>
<option>Middle East</option>
<option>Africa</option>
<option>Asia Pacific</option>
<option>Individual country</option>
<option>Multiple regions</option>
<option>Other</option>
</select>

</div>
    
    <div class="form-group">

<label>
Leadership team size
<span class="help">Approximately how many leaders will participate in the assessment?</span>
</label>

<select id="leadershipSize" required>

<option value="">Select leadership team size</option>
<option>1–5</option>
<option>6–10</option>
<option>11–20</option>
<option>21+</option>

</select>

</div>


<button type="submit">
Continue to Leadership Assessment →
</button>

</form>

</main>

<script>

document.getElementById("contextForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const context = {
        serviceRevenue: document.getElementById("serviceRevenue").value,
        ambition: document.getElementById("ambition").value,
        currentServiceObjective: document.getElementById("currentServiceObjective").value,
        desiredServiceObjective: document.getElementById("desiredServiceObjective").value,
        serviceChangeDriver: document.getElementById("serviceChangeDriver").value,
        leadershipAlignment: document.getElementById("leadershipAlignment").value,
        serviceTimeHorizon: document.getElementById("serviceTimeHorizon").value,
        customerValuePriority: document.getElementById("customerValuePriority").value,
        customerExpectationChange: document.getElementById("customerExpectationChange").value,
        customerInsightStrength: document.getElementById("customerInsightStrength").value,
        customerInsightUse: document.getElementById("customerInsightUse").value,
        serviceMeaning: document.getElementById("serviceMeaning").value,
        respondentRole: document.getElementById("respondentRole").value,
        respondentFunction: document.getElementById("respondentFunction").value,
        respondentGeography: document.getElementById("respondentGeography").value,
        leadershipSize: document.getElementById("leadershipSize").value
    };

    localStorage.setItem("servitisationAlignContext", JSON.stringify(context));

    window.location.href = "assessment.html";

});

</script>

</body>
</html>
