<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Organisation | SERVITISATION.WORLD ALIGN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1f2933;
    }

    header {
      padding: 28px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand span {
      font-weight: 400;
      margin-left: 10px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 70px 30px 100px;
    }

    .progress {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 44px;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .intro {
      font-size: 19px;
      line-height: 1.6;
      color: #52606d;
      margin-bottom: 50px;
      max-width: 720px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd2d9;
      border-radius: 4px;
      font-size: 16px;
      background: white;
    }

    .actions {
      margin-top: 45px;
      padding-top: 30px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back {
      color: #52606d;
      text-decoration: none;
      font-weight: 700;
    }

    button {
      padding: 17px 30px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
SERVITISATION.WORLD <span>&nbsp;&nbsp;|&nbsp;&nbsp;ALIGN</span>
    </div>

    <div>Leadership Alignment for Service Growth</div>
  </header>

  <main class="container">

    <div class="progress">
      STEP 1 OF 3 · YOUR ORGANISATION
    </div>

    <h1>Tell us about your organisation.</h1>

    <p class="intro">
      Before we assess leadership alignment, we need to understand the
      business and the role service plays within it today.
    </p>

    <form id="organisationForm">

      <div class="form-grid">

        <div class="field full">
          <label for="company">Company name</label>
          <input id="company" type="text" required>
        </div>

        <div class="field">
          <label for="name">Your name</label>
          <input id="name" type="text" required>
        </div>

        <div class="field">
          <label for="role">Your role</label>
          <input id="role" type="text" placeholder="e.g. Head of Service" required>
        </div>

        <div class="field">
          <label for="industry">Industry</label>
          <input id="industry" type="text" placeholder="e.g. Packaging, Manufacturing">
        </div>

        <div class="field">
          <label for="country">Country / Region</label>
          <input id="country" type="text">
        </div>

        <div class="field">
          <label for="employees">Number of employees</label>
          <select id="employees">
            <option value="">Select</option>
            <option>1–249</option>
            <option>250–999</option>
            <option>1,000–4,999</option>
            <option>5,000–9,999</option>
            <option>10,000+</option>
          </select>
        </div>

        <div class="field">
          <label for="revenue">Annual company revenue</label>
          <select id="revenue">
            <option value="">Select</option>
            <option>Under €50m</option>
            <option>€50m–€249m</option>
            <option>€250m–€999m</option>
            <option>€1bn–€5bn</option>
            <option>Over €5bn</option>
          </select>
        </div>

        <div class="field full">
          <label for="model">Primary business model</label>
          <select id="model">
            <option value="">Select the closest description</option>
            <option>Equipment / machinery manufacturer</option>
            <option>Product manufacturer</option>
            <option>Technology provider</option>
            <option>Industrial solutions provider</option>
            <option>Service-led organisation</option>
            <option>Other</option>
          </select>
        </div>

      </div>

      <div class="actions">

        <a href="index.html" class="back">← Back</a>

        <button type="submit">
          Continue to Service Context →
        </button>

      </div>

    </form>

  </main>

  <script>
    document.getElementById("organisationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const organisation = {
        company: document.getElementById("company").value,
        name: document.getElementById("name").value,
        role: document.getElementById("role").value,
        industry: document.getElementById("industry").value,
        country: document.getElementById("country").value,
        employees: document.getElementById("employees").value,
        revenue: document.getElementById("revenue").value,
        model: document.getElementById("model").value
      };

      localStorage.setItem("alignOrganisation", JSON.stringify(organisation));

      window.location.href = "context.html";
    });
  </script>

</body>
</html>
